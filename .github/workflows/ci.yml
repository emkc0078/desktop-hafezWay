name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  # Do not cancel in-flight master releases — a cancelled bump/publish leaves master inconsistent.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web assets
        run: npm run build

      # Dist is only kept for manual workflow_dispatch debugging — not every master push
      # (avoids filling GitHub Actions artifact storage quota).
      - name: Upload dist artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: desktop-dist-${{ github.sha }}
          path: dist
          retention-days: 3

  # Packages + publishes a GitHub Release so installed apps (electron-updater) see the new version.
  release-windows:
    name: Release Windows
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Needed so the version bump commit can be pushed back to master.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bump version, commit, and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Master may move while this job runs (other merges). Always bump from the
          # current tip and retry push after a non-fast-forward rejection.
          for attempt in 1 2 3 4 5; do
            git fetch origin master
            git reset --hard origin/master
            npm run bump
            git add package.json
            if git diff --cached --quiet; then
              echo "No version change to commit"
              exit 0
            fi
            HUSKY=0 git commit -m "chore: bump version for release [skip ci]"
            if git push origin HEAD:master; then
              echo "Pushed version bump on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); retrying from latest master..."
            sleep $((attempt * 3))
          done
          echo "Failed to push version bump after retries"
          exit 1

      - name: Icons + Vite build
        run: npm run icons && npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Build + publish GitHub Release
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Print release link
        run: node scripts/print-release-link.cjs

      # Do not upload `release/` as an Actions artifact — electron-builder already
      # publishes installers to the GitHub Release, and duplicate artifacts hit storage quota.